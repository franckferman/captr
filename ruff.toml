# Correctness-focused lint, kept conservative so it stays green and meaningful:
# real bugs (pyflakes F), syntax (E9), import/statement hygiene (E4/E7), and
# whitespace warnings (W). No line-length (E501) and no pyupgrade (UP) rules,
# since the project targets Python 3.9.
target-version = "py39"

[lint]
select = ["E4", "E7", "E9", "F", "W"]
